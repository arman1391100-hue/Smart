 else if(k==3){e=fa(x)+'²';a=x*x}else if(k==4){e='√'+fa(x*x);a=x}
 else if(k==5){e=fa(x)+'%';a=x*y/100}else{e=fa(x)+' ÷ '+fa(y);a=x/y}
 let q=fk?'حاصل ':'Compute ';q+=I(e);if(k==5)q+=(fk?' از ':' of ')+fa(y);q+=fk?'؟':'?';
 const d=shuf([1,-1,2,-2,3,-3,5,-5,10,-10,11,-11]).filter(v=>a+v>=0).slice(0,3).map(v=>fa(a+v));
 return[q,fa(a),...d]}
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[آأإ]/g,'ا').replace(/[\u200c\u200d\u064b-\u065f\s.,٫'’"\-_()«»]/g,'');
const lev=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[m][n]};
const chk=(q,v)=>{const u=nz(v);if(!u)return false;return[q.ca].concat(q.a||[]).some(x=>{const w=nz(x);if(u==w)return true;const tol=w.length>=11?2:w.length>=5?1:0;return tol>0&&lev(u,w)<=tol})};

 const is=impSeen(),imp=IMP.map((T,i)=>({x:3,imp:i,seen:is.includes(i),mk:()=>({id:null,imp:i,q:fk?T[0]:T[1],o:[],c:0,ty:1,ca:fk?T[2]:T[3],a:[T[2],T[3]].concat(T[4]||[])})})).concat(IMC.map((T,j)=>{const i=IMP.length+j;return{x:3,imp:i,seen:is.includes(i),mk:()=>{const q=mc({r:[fk?T[0]:T[1]].concat(fk?T[2]:T[3]),id:null});q.imp=i;return q}}})).concat(IMP2.map((T,j)=>{const i=IMP.length+IMC.length+j;return{x:3,imp:i,seen:is.includes(i),mk:()=>({id:null,imp:i,q:fk?T[0]:T[1],o:[],c:0,ty:1,ca:fk?T[2]:T[3],a:[T[2],T[3]].concat(T[4]||[])})}})).concat(IMP3.map((T,j)=>{const i=IMP.length+IMC.length+IMP2.length+j;return{x:3,imp:i,seen:is.includes(i),mk:()=>({id:null,imp:i,q:fk?T[0]:T[1],o:[],c:0,ty:1,ca:fk?T[2]:T[3],a:[T[2],T[3]].concat(T[4]||[])})}}));
 const sn=o=>o.imp!=null?o.seen:isSeen(o.id),dist=o=>Math.min(...lv.map(l=>Math.abs(o.x-l)));

  lv.forEach((l,i)=>add(shuf(list.filter(o=>o.x==l&&!sn(o))).slice(0,Math.floor(k/lv.length)+(i<k%lv.length?1:0))));

 lang(v){cfg.lang=v;menu()},dq(v){cfg.dq=+v;menu()},time(v){cfg.time=+v;menu()},buzz(v){cfg.buzz=v=='1';menu()},rand(){search()},near(){search(true)},cancel(){srch=false;if(lob)lob.presence({srch:null});menu()},
 mode(v){cfg.mode=v;msg='';menu()},n(v){cfg.n=+v;menu()},lvl(v){cfg.lvl=+v;menu()},np(v){cfg.np=+v;menu()},
 start(){cfg.me=($('#nm')||{}).value||cfg.me;start()},
 create(){online(true)},join(){online(false)},
 begin(){G.t=cfg.time;G.buzz=cfg.buzz;G.lg=cfg.lang;G.qs=build();G.n=cfg.n;G.i=-1;G.pl.forEach(p=>p.s=0);next()},
 home(){if(room){room.leave();room=null}G=null;host=true;msg='';menu()},
 dtog(v){const i=+v;cfg.ds[i]=!cfg.ds[i];if(!cfg.ds.some(Boolean))cfg.ds[i]=true;menu()},
 submit(){if(!G||G.phase!='q')return;const el=$('#ti'),v=el?el.value:'';
  if(!host){const id=myId();if(id&&!(id in G.ans)){G.ans[id]=1;room.emit('ans',{s:String(v).slice(0,60)});render()}return}
  const q=G.qs[G.i];if(!q||!q.ty)return;if(el)el.value='';
  answer(G.mode=='local'?G.pl[G.turn].id:G.mode=='online'?'host':'me',chk(q,v)?q.c:-2)},
 pick(v){if(!G||G.phase!='q')return;const c=+v;
  if(!host){const id=myId();if(id&&!(id in G.ans)){G.ans[id]=c;room.emit('ans',{c});render()}return}
  answer(G.mode=='local'?G.pl[G.turn].id:G.mode=='online'?'host':'me',c)}};
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act[b.dataset.a](b.dataset.v)};
app.onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='ti')act.submit()};
app.oninput=e=>{const t=e.target;if(t.dataset.i!==undefined)cfg.names[+t.dataset.i]=t.value;else if(t.id=='nm')cfg.me=t.value};
menu();
</script>
</body>
</html>
