<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کی باهوش‌تره؟</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2530;--mu:#667085;--ac0:#0f766e;--ac:var(--ac0);--acx:#fff;--ok:#15803d;--no:#b42318;--bd:#e1e5ea;--c1:var(--ac);--c2:var(--ac);--c3:var(--mu);--c4:var(--ok);--c5:var(--ac);--o1:var(--ac);--o2:var(--ac);--o3:var(--ac);--o4:var(--ac);--sh:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#172130;--tx:#e8edf3;--mu:#9aa5b4;--ac:color-mix(in srgb,var(--ac0) 60%,#fff);--acx:#0b1220;--ok:#4ade80;--no:#f87171;--bd:#263344;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(800px 380px at 50% -140px,color-mix(in srgb,var(--ac) 16%,transparent),transparent) no-repeat,var(--bg);color:var(--tx);font:16px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:18px 16px}
h1{text-align:center;margin:10px 0 20px;font-size:27px;font-weight:800;color:var(--tx)}h1::after{content:'';display:block;width:44px;height:4px;border-radius:4px;background:var(--ac);margin:8px auto 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
.lb{color:var(--mu);font-size:14px;margin:0 0 8px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
.b{flex:1;min-width:70px;padding:10px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.b{transition:transform .12s,border-color .15s,background .15s}.b.on,.go{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));color:var(--acx);border-color:var(--ac);font-weight:700}.b:active,.go:active,.o:not(:disabled):active{transform:scale(.98)}
.go{width:100%;padding:14px;border-radius:14px;font-size:17px;cursor:pointer;margin-top:6px;box-shadow:0 6px 14px color-mix(in srgb,var(--ac) 30%,transparent)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin-top:6px}
input:focus{outline:2px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:0;border-color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff));width:100%;transition:width .25s linear;border-radius:6px}
.bar.low i{background:var(--no)}#tt.low{color:var(--no);font-weight:700}
.q{font-size:20px;font-weight:700;margin:18px 0;text-align:center;min-height:60px;line-height:1.8;counter-reset:o}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;margin-bottom:9px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:500;counter-increment:o;box-shadow:var(--sh);transition:transform .12s,border-color .15s,background .15s}.o::before{content:counter(o,upper-alpha);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 13%,transparent)}:lang(fa) .o::before{content:counter(o,persian)}.o.ty::before{display:none}.o.ty{justify-content:center}
@media(hover:hover){.b:hover,.o:not(:disabled):hover{border-color:var(--ac)}}
.o.cr,.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.o.wr,.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--card))}
.o.dim{opacity:.5}
.o.ty{text-align:center;cursor:default}
.ti{font-size:19px;text-align:center;padding:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:3px 11px;border-radius:20px;background:color-mix(in srgb,var(--ac) 9%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 28%,var(--bd));font-size:14px}.sw{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.code{font:700 38px monospace;letter-spacing:8px;text-align:center;direction:ltr;color:var(--ac)}
.c{text-align:center}.mu{color:var(--mu)}
.rk{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.rk:last-child{border-bottom:0}
.big{font-size:48px;text-align:center;line-height:1.2}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--ac);height:28px}
#mzf{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:19px;z-index:50;cursor:pointer}

/* ===== رنگ‌های جذاب‌تر: رنگ اصلی + رنگ مکمل ===== */
:root{--a2:color-mix(in srgb,var(--ac0) 55%,#ec4899);--ac2:var(--a2);--acx:var(--acx0,#fff)}
@supports (color:hsl(from red h s l)){:root{--a2:hsl(from var(--ac0) calc(h + 40) s l)}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac2:color-mix(in srgb,var(--a2) 60%,#fff)}}
body{background:radial-gradient(720px 380px at 88% -140px,color-mix(in srgb,var(--ac) 22%,transparent),transparent) no-repeat,radial-gradient(620px 340px at 8% -110px,color-mix(in srgb,var(--ac2) 18%,transparent),transparent) no-repeat,var(--bg)}
h1::after{width:58px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.card{border-top-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.b.on,.go{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.go{box-shadow:0 8px 18px color-mix(in srgb,var(--ac) 32%,transparent)}
.bar i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.o::before{color:var(--ac);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,transparent),color-mix(in srgb,var(--ac2) 20%,transparent))}
@media(hover:hover){.o:not(:disabled):hover{background:color-mix(in srgb,var(--ac) 7%,var(--card));border-color:var(--ac)}}
.chip:nth-child(even){background:color-mix(in srgb,var(--ac2) 11%,var(--card));border-color:color-mix(in srgb,var(--ac2) 32%,var(--bd))}
.code{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{background-clip:padding-box}

/* ===== حرکت‌ها (با رنگ اصلی و مکمل انتخاب‌شده هماهنگ‌اند) ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body::before{content:'';position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 22% 28%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 38%),radial-gradient(circle at 78% 72%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent 40%);animation:drift 24s ease-in-out infinite alternate}
.b,.go,.o,.chip,.card,.sw{transition:transform .22s var(--ease),box-shadow .25s,border-color .2s,background-color .25s,opacity .3s,filter .25s}
@media(hover:hover){.b:hover,.o:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--ac) 18%,transparent)}.go:hover{transform:translateY(-2px);filter:brightness(1.07)}.sw:hover{transform:scale(1.15)}}
.b:active,.go:active,.o:not(:disabled):active,.sw:active{transform:scale(.95)}
.go{position:relative;overflow:hidden}.go::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
.b.selpop{animation:selPop .5s var(--spring),selRing .65s ease-out}
.card.need{animation:shake .5s both;border-color:var(--no);box-shadow:0 0 0 3px color-mix(in srgb,var(--no) 22%,transparent)}
.warn{color:var(--no);font-weight:700}
#app.min>*{animation:fadeUp .55s var(--ease) both}
#app.min>:nth-child(2){animation-delay:.04s}#app.min>:nth-child(3){animation-delay:.08s}#app.min>:nth-child(4){animation-delay:.12s}#app.min>:nth-child(5){animation-delay:.16s}#app.min>:nth-child(6){animation-delay:.2s}#app.min>:nth-child(7){animation-delay:.24s}#app.min>:nth-child(8){animation-delay:.28s}#app.min>:nth-child(9){animation-delay:.32s}#app.min>:nth-child(n+10){animation-delay:.36s}
#tt{display:inline-block}#tt.low{animation:tickPulse .8s ease-in-out infinite}
.bar i{transition:width .25s linear,background .4s}.bar.low{animation:lowPulse .8s ease-in-out infinite}
#app.qin .chips{animation:fadeUp .4s var(--ease) both}
#app.qin .bar{animation:barIn .7s var(--ease) both;transform-origin:right center}
#app.qin .q{animation:qIn .6s var(--ease) both .05s}
#app.qin .o{animation:optIn .6s var(--spring) both}
#app.qin .o:nth-of-type(1){animation-delay:.12s}#app.qin .o:nth-of-type(2){animation-delay:.2s}#app.qin .o:nth-of-type(3){animation-delay:.28s}#app.qin .o:nth-of-type(4){animation-delay:.36s}
#app.qin .o::before{animation:badge .55s var(--spring) both .3s}
#app.qin .ti,#app.qin .go{animation:fadeUp .5s var(--ease) both .1s}
#app.rvin .o.cr,#app.rvin .o.ok{animation:okPop .65s var(--spring) both,okGlow 1.1s ease-out}
#app.rvin .o.cr::before{animation:badge .6s var(--spring) both}
#app.rvin .o.wr{animation:shake .5s both}
#app.rvin .o.dim{animation:dimOut .45s both}
.chip.bump{animation:bump .6s var(--spring)}
#app.endin h1{animation:qIn .6s var(--ease) both}
#app.endin .big{display:inline-block;animation:medal 1.2s var(--spring) both .1s}
#app.endin .card{animation:fadeUp .6s var(--ease) both}#app.endin .card:nth-of-type(2){animation-delay:.2s}
#app.endin .rk{animation:fadeUp .5s var(--ease) both}#app.endin .rk:nth-child(1){animation-delay:.3s}#app.endin .rk:nth-child(2){animation-delay:.42s}#app.endin .rk:nth-child(3){animation-delay:.54s}#app.endin .rk:nth-child(4){animation-delay:.66s}#app.endin .rk:nth-child(5){animation-delay:.78s}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
.flt{position:fixed;z-index:100;pointer-events:none;font-weight:800;font-size:24px;color:var(--ok);animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 10px color-mix(in srgb,var(--ok) 40%,transparent)}
#mzf.on{animation:bob 1.8s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes qIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes optIn{from{opacity:0;transform:translateX(-30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes badge{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes okPop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes okGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 65%,transparent)}100%{box-shadow:0 0 0 24px transparent}}
@keyframes shake{10%,50%,90%{transform:translateX(-8px)}30%,70%{transform:translateX(8px)}}
@keyframes dimOut{from{opacity:1}to{opacity:.45}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3);background:var(--ac);color:var(--acx)}100%{transform:scale(1)}}
@keyframes medal{0%{transform:scale(0) rotate(-200deg);opacity:0}70%{transform:scale(1.25) rotate(12deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-80px) scale(1.35)}}
@keyframes selPop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes selRing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 55%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes lowPulse{50%{opacity:.4}}
@keyframes tickPulse{50%{transform:scale(1.25)}}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.12)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
@media(prefers-reduced-motion:reduce){body::before,.go::after,#mzf.on{animation:none!important}}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important}

/* منو روی صفحه‌های عریض: چند ستونه و کوتاه‌تر (گوشی بدون تغییر) */
@media(min-width:640px){
 #app.menuv{max-width:860px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:stretch;grid-auto-flow:dense;padding:18px 22px}
 #app.menuv>.card{margin-bottom:0}
 #app.menuv>h1,#app.menuv>.row,#app.menuv>button.go,#app.menuv>p{grid-column:1/-1}
 #app.menuv>h1{margin:4px 0 2px}
 #app.menuv>.row{max-width:460px;width:100%;justify-self:center}
 #app.menuv>button.go{max-width:460px;width:100%;justify-self:center;margin-top:2px}
 #app.menuv>.card:has(.b:nth-child(7)){grid-column:1/-1}
}
@media(min-width:1000px){
 #app.menuv{max-width:1240px;grid-template-columns:repeat(3,minmax(0,1fr));padding:18px 28px}
 #app.menuv>.card:has(.b:nth-child(7)){grid-column:span 2}
 #app.menuv>.card:has(.b:nth-child(13)){grid-column:1/-1}
}

/* ===== ظاهر بازی‌وار: دکمه‌های برجسته، کاشی‌های رنگی، جلوه‌ها ===== */
:root{--press:color-mix(in srgb,var(--ac0) 60%,#000)}
body{position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;width:340px;height:340px;border-radius:50%;z-index:-1;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
body::before{right:-120px;bottom:-140px;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--ac2) 26%,transparent),transparent 66%)}
body::after{left:-140px;top:30%;background:radial-gradient(circle at 60% 40%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 66%);animation-duration:21s}
@keyframes drift{to{transform:translate(-26px,-36px) scale(1.1)}}
h1{font-size:31px;font-weight:900;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:20px}
.go{border:0;border-radius:16px;font-size:18px;font-weight:800;box-shadow:0 5px 0 var(--press),0 14px 24px color-mix(in srgb,var(--ac) 28%,transparent);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--press)}
.b{border-radius:14px;border-bottom-width:3px;font-weight:600}.b.on{border:0;box-shadow:0 3px 0 var(--press)}
.q{background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--ac);border-radius:20px;padding:18px 16px;box-shadow:var(--sh);margin:14px 0 18px;min-height:86px;display:grid;place-items:center}
.bar{height:10px;border-radius:10px}.bar i{box-shadow:0 0 12px color-mix(in srgb,var(--ac) 50%,transparent)}
.chip{font-weight:600;padding:4px 12px}
/* کاشی‌های پاسخ: چهار رنگ هماهنگ دور رنگ اصلی */
.o{--oi:0;--oc:var(--ac)}
@supports (color:hsl(from red h s l)){.o{--oc:hsl(from var(--ac0) calc(h + var(--oi)*80) calc(s*.9) calc(l*.92))}}
.o{border:2px solid color-mix(in srgb,var(--oc) 40%,var(--bd));border-bottom-width:5px;border-radius:16px;background:color-mix(in srgb,var(--oc) 9%,var(--card));box-shadow:none;font-weight:600;transition:transform .08s,border-color .15s,background .15s}
.o::before{background:var(--oc);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
@media(hover:hover){.o:not(:disabled):hover{border-color:var(--oc);background:color-mix(in srgb,var(--oc) 16%,var(--card));transform:translateY(-1px)}}
.o:not(:disabled):active{transform:translateY(3px);border-bottom-width:2px}
.o.cr,.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));animation:pop .35s}.o.cr::before,.o.ok::before{background:var(--ok)}
.o.wr,.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card));animation:nope .35s}.o.wr::before,.o.no::before{background:var(--no)}
.o.ty::before{display:none}
@keyframes pop{45%{transform:scale(1.03)}}@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#app.endin .big{animation:boing .6s both}@keyframes boing{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
/* جلوه‌ها دوباره فعال شد */
#fxc{display:block!important;position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.flt{display:block!important;position:fixed;transform:translateX(-50%);font-weight:900;font-size:24px;color:var(--ok);pointer-events:none;z-index:71;animation:flt 1s ease-out forwards}
@keyframes flt{to{transform:translate(-50%,-70px);opacity:0}}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:72;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){body::before,body::after,.o,.go{animation:none!important}#fxc,.flt,.cf{display:none!important}}

/* ===== منوی اصلی به سبک اپ‌های مدرن ===== */
.lang{justify-content:flex-end;gap:6px;margin-bottom:0!important}.lang .b{flex:none;min-width:0;padding:3px 12px;border-radius:20px;font-size:13px;border-bottom-width:1px}
.hero{text-align:center;margin:4px 0 14px}.hero .logo{width:78px;height:78px;margin:0 auto 12px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 7px 0 var(--press),0 18px 30px color-mix(in srgb,var(--ac) 30%,transparent);transform:rotate(-6deg);animation:rise .5s both}.hero h1{margin:4px 0 2px}.hero h1::after{display:none}.hero .tag{margin:0;color:var(--mu);font-size:15px}
.sec{font-weight:800;font-size:17px;margin:14px 4px 8px}
