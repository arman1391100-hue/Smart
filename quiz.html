 else if(!rv&&me!==undefined)turnTxt='<p class="c mu">'+t('answered')+'</p>';
 const picked=G.mode=='local'?null:me;
 let h=`<div class="chips">${sc}</div><p class="mu c">${t('qn')} ${fa(G.i+1)}/${fa(G.n)} · <span id="tt"></span> ${t('sec')}</p><div class="bar"><i id="tb"></i></div><div class="q">${esc(q.q)}</div>`;
 h+=q.o.map((t,k)=>`<button class="o${rv&&k==q.c?' ok':rv&&k===picked?' no':''}" data-a="pick" data-v="${k}"${rv||(G.mode!='local'&&me!==undefined)?' disabled':''}>${esc(t)}</button>`).join('')+turnTxt;
 if(rv)h+='<div class="chips">'+G.pl.map(p=>`<span class="chip">${esc(p.name)} ${G.ans[p.id]==-1?'—':G.ans[p.id]==q.c?'✅':'❌'}</span>`).join('')+'</div>';
 app.innerHTML=h;tick()}
function tick(){
 if(!G||G.phase!='q')return;const r=Math.max(0,G.dl-Date.now()),t=$('#tt'),b=$('#tb');
 if(t){t.textContent=fa(Math.ceil(r/1000));b.style.width=r/((G.t||15)*10)+'%'}
 if(host&&r<=0){G.mode=='local'?answer(G.pl[G.turn].id,-1):reveal()}}
setInterval(tick,250);

async function online(create,mc){
 room=null;const R=await useRoom();
 if(!R){msg=t('noroom');pend=null;return menu()}
 const code=mc||(create?Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join(''):($('#cd').value||'').trim().toLowerCase());
 if(!/^[a-z0-9]{3,6}$/.test(code)){msg=t('badcode');return menu()}
 if(!mc)cfg.me=$('#nm').value;msg=t('conn');menu();
 try{room=await R.join('qk-'+code)}catch(e){msg=t('fail');pend=null;room=null;return menu()}
 host=create;const name=clean(cfg.me);
 room.on('ans',m=>{if(host&&G&&!m.isMe&&m.data&&[0,1,2,3].includes(m.data.c))answer(m.peer,m.data.c)});
 room.on('state',m=>{if(host||m.isMe||!m.data)return;G=m.data;G.dl=Date.now()+(G.rem||0);if(G.phase=='q'&&G.cur&&G.cur.id!=null)mark(G.cur.id,G.lg);render()});
 if(create){
  room.on('join',m=>{if(!host||m.isMe||!G)return;if(G.phase=='lobby'&&G.pl.length<5&&!G.pl.some(p=>p.id==m.peer))G.pl.push({id:m.peer,name:clean(m.data&&m.data.name),s:0});try{peerSeen[m.peer]={fa:dec(m.data.sf),en:dec(m.data.se)}}catch(e){}if(G.auto&&G.pl.length==2)return act.begin();pub()});
  G={mode:'online',phase:'lobby',pl:[{id:'host',name,s:0}],n:cfg.n,code,qs:[],i:-1,ans:{},id:++gid};render();if(pend){lob.emit('match',{a:pend.a,b:pend.b,code});pend=null;G.auto=1}}
 else{const send=()=>room.emit('join',{name,sf:enc(seenOf('fa')),se:enc(seenOf('en'))});send();setTimeout(()=>{if(!G)send()},1500);
  setTimeout(()=>{if(!G){msg=t('nf');room.leave();room=null;menu()}},6000)}}

async function search(){
 cfg.me=($('#nm')||{}).value||cfg.me;
 const R=await useRoom();if(!R){msg=t('noroom');return menu()}
 lob=R;srch=true;menu();
 if(!reg){reg=1;
  R.on('match',m=>{const d=m.data||{},me=R.peers().find(p=>p.isMe&&p.sameTab);if(srch&&me&&d.b==me.peer&&/^[a-z0-9]{4}$/.test(d.code||'')){srch=false;R.presence({srch:null});online(false,d.code)}});
  R.onPeers(ch=>{if(!srch||pend)return;const me=ch.peers.find(p=>p.isMe&&p.sameTab);if(!me)return;
   const l=ch.peers.filter(p=>p.kind=='viewer'&&p.presence&&p.presence.srch&&(!p.isMe||p.sameTab)).sort((a,b)=>a.peer<b.peer?-1:1);
   if(l.length>1&&l[0].peer==me.peer){srch=false;pend={a:me.peer,b:l[1].peer};R.presence({srch:null});online(true,Math.random().toString(36).slice(2,6).padEnd(4,'x'))}})}
 R.presence({srch:1})}
const act={
 lang(v){cfg.lang=v;menu()},dq(v){cfg.dq=+v;menu()},time(v){cfg.time=+v;menu()},buzz(v){cfg.buzz=v=='1';menu()},rand(){search()},cancel(){srch=false;if(lob)lob.presence({srch:null});menu()},
 mode(v){cfg.mode=v;msg='';menu()},n(v){cfg.n=+v;menu()},lvl(v){cfg.lvl=+v;menu()},np(v){cfg.np=+v;menu()},
 start(){cfg.me=($('#nm')||{}).value||cfg.me;start()},
 create(){online(true)},join(){online(false)},
 begin(){G.t=cfg.time;G.buzz=cfg.buzz;G.lg=cfg.lang;G.qs=build();G.n=cfg.n;G.i=-1;G.pl.forEach(p=>p.s=0);next()},
 home(){if(room){room.leave();room=null}G=null;host=true;msg='';menu()},
 pick(v){if(!G||G.phase!='q')return;const c=+v;
  if(!host){const id=myId();if(id&&!(id in G.ans)){G.ans[id]=c;room.emit('ans',{c});render()}return}
  answer(G.mode=='local'?G.pl[G.turn].id:G.mode=='online'?'host':'me',c)}};
app.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act[b.dataset.a](b.dataset.v)};
app.oninput=e=>{const t=e.target;if(t.dataset.i!==undefined)cfg.names[+t.dataset.i]=t.value;else if(t.id=='nm')cfg.me=t.value};
menu();
</script>
