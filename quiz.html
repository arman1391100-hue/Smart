function mkShim(){const B=location.origin,subs={};let id=null,near=null,q=Promise.resolve();const pid=Array.from({length:12},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.random()*36|0]).join(''),pres={};

 const room=n=>({emit:(t,d)=>post({op:'emit',room:n,topic:t,data:d}),
  on:(t,f)=>{(R(n).on[t]=R(n).on[t]||[]).push(f);return()=>{R(n).on[t]=R(n).on[t].filter(x=>x!==f)}},
  presence:pt=>{pres[n]=Object.assign(pres[n]||{},pt);return post({op:'presence',room:n,patch:pt})},peers:()=>R(n).pl,
  onPeers:f=>{R(n).pe.push(f);return()=>{R(n).pe=R(n).pe.filter(x=>x!==f)}},

  room.on('join',m=>{if(!host||m.isMe||!G||!RL('j'+m.peer))return;if(G.phase=='lobby'&&G.pl.length<5&&!G.pl.some(p=>p.id==m.peer))G.pl.push({id:m.peer,name:clean(m.data&&m.data.name),s:0});try{peerSeen[m.peer]={fa:dec(m.data.sf),en:dec(m.data.se)}}catch(e){}if(G.auto&&G.pl.length==2)return act.begin();pub()});
  G={mode:'online',phase:'lobby',pl:[{id:'host',name,s:0}],n:cfg.n,code,qs:[],i:-1,ans:{},id:++gid};render();if(pend){lob.emit('match',{a:pend.a,b:pend.b,code});pend=null;G.auto=1}}
 else{const send=()=>room.emit('join',{name,sf:enc(seenOf('fa')),se:enc(seenOf('en'))}),inRoom=()=>G&&(G.phase!='lobby'||(G.pl||[]).some(p=>p.id==myId()));send();let tries=0;const iv=setInterval(()=>{if(!room||inRoom()){clearInterval(iv);return}if(++tries>=8){clearInterval(iv);msg=t('nf');room.leave();room=null;G=null;menu();return}send()},1500)
  }}

async function search(near){
 cfg.me=($('#nm')||{}).value||cfg.me;
 const R0=await useRoom();if(!R0){msg=t('noroom');return menu()}
 let R=R0;
 if(near){const k=R0.near&&R0.near();if(!k){msg=t('nonear');return menu()}try{R=await R0.join('near-'+k)}catch(e){msg=t('fail');return menu()}}
 lob=R;srch=true;menu();
 const rk=near?'n':'r';
 if(!regs[rk]){regs[rk]=1;
  R.on('match',m=>{const d=m.data||{},me=R.peers().find(p=>p.isMe&&p.sameTab);if(srch&&me&&d.b==me.peer&&/^[a-z0-9]{4,6}$/.test(d.code||'')){srch=false;R.presence({srch:null});online(false,d.code)}});
  R.onPeers(ch=>{if(!srch||pend)return;const me=ch.peers.find(p=>p.isMe&&p.sameTab);if(!me)return;
   const l=ch.peers.filter(p=>p.kind=='viewer'&&p.presence&&p.presence.srch&&(!p.isMe||p.sameTab)).sort((a,b)=>a.peer<b.peer?-1:1);
   if(l.length>1&&l[0].peer==me.peer){srch=false;pend={a:me.peer,b:l[1].peer};R.presence({srch:null});online(true,rc())}})}
 R.presence({srch:1})}
const act={
 lang(v){cfg.lang=v;menu()},lb(){if(room){room.leave();room=null}G=null;host=true;view='lb';menu()},back(){view='';menu()},tab(v){lbT=v;menu()},cat(v){cfg.cat=v;menu()},qt(v){cfg.qt=v;menu()},snd(){cfg.snd=!cfg.snd;try{localStorage.setItem('wis-snd',cfg.snd?'1':'0')}catch(e){}menu()},dq(v){cfg.dq=+v;menu()},time(v){cfg.time=+v;menu()},buzz(v){cfg.buzz=v=='1';menu()},rand(){search()},near(){search(true)},cancel(){srch=false;if(lob)lob.presence({srch:null});menu()},
 mode(v){cfg.mode=v;msg='';menu()},n(v){cfg.n=+v;menu()},lvl(v){cfg.lvl=+v;menu()},np(v){cfg.np=+v;menu()},
 start(){cfg.me=($('#nm')||{}).value||cfg.me;start()},
 create(){online(true)},join(){online(false)},
 begin(){G.t=cfg.time;G.buzz=cfg.buzz;G.lg=cfg.lang;G.qs=build();G.n=G.qs.length;G.i=-1;G.pl.forEach(p=>p.s=0);next()},
 home(){if(room){room.leave();room=null}G=null;host=true;msg='';menu()},
 dtog(v){const i=+v;cfg.ds[i]=!cfg.ds[i];if(!cfg.ds.some(Boolean))cfg.ds[i]=true;menu()},
 submit(){if(!G||G.phase!='q')return;const el=$('#ti'),v=el?el.value:'';
  if(!host){const id=myId();if(id&&!(id in G.ans)){G.ans[id]=1;room.emit('ans',{s:String(v).slice(0,60)});render()}return}
  const q=G.qs[G.i];if(!q||!q.ty)return;if(el)el.value='';
  answer(G.mode=='local'?G.pl[G.turn].id:G.mode=='online'?'host':'me',chk(q,v)?q.c:-2)},
 pick(v){if(!G||G.phase!='q')return;const c=+v;
  if(!host){const id=myId();if(id&&!(id in G.ans)){G.ans[id]=c;room.emit('ans',{c});render()}return}
  answer(G.mode=='local'?G.pl[G.turn].id:G.mode=='online'?'host':'me',c)}};
function yn(q){const ok=Math.random()<.5,fk=cfg.lang=='fa',rv=cfg.qt=='rev',a=ok?q.o[q.c]:shuf(q.o.filter((_,i)=>i!=q.c))[0];return{id:q.id,k:q.k,q:(rv?(fk?'🔄 برعکس جواب بده! ':'🔄 Answer the opposite! '):'')+(fk?q.q+' آیا پاسخ «'+a+'» است؟':q.q+' Is the answer "'+a+'"?'),o:fk?['آره','نه']:['Yes','No'],c:(ok?0:1)^(rv?1:0)}}
function ynq(o,id){const fk=cfg.lang=='fa',rv=cfg.qt=='rev';return{id,k:o.k,q:(rv?(fk?'🔄 برعکس جواب بده! ':'🔄 Answer the opposite! '):'')+(fk?'آیا این جمله درست است؟ «'+o.t+'»':'Is this statement true? "'+o.t+'"'),o:fk?['آره','نه']:['Yes','No'],c:(o.v?0:1)^(rv?1:0)}}
const RLm={},RL=p=>{const n=Date.now();if(n-(RLm[p]||0)<250)return false;RLm[p]=n;return true};

function beep(ok){if(!cfg.snd)return;try{if(AC)(ok?[660,880]:[220,165]).forEach((h,i)=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+i*.12;o.type=ok?'sine':'sawtooth';o.frequency.value=h;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.2)});navigator.vibrate&&navigator.vibrate(ok?30:[60,40,60])}catch(e){}}
function fx(q,rv,me){if(!rv)return;const k=(G.code||'')+'|'+G.id+'|'+G.i;if(lastK==k)return;lastK=k;if(G.mode=='local'||me===undefined)return;beep(me===q.c)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<28;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','⭐','🎊','✨'][i%4];e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function saveRes(){if(G.saved)return;G.saved=1;if(G.mode=='local')return;const my=myId(),p=G.pl.find(x=>x.id==my)||G.pl[0],v=Math.round(p.s*100/G.n);G.pcv=v;try{const a=JSON.parse(localStorage.getItem('wis-lb')||'[]');a.push({nm:p.name,s:p.s,n:G.n,pc:v,m:G.mode,d:Date.now()});localStorage.setItem('wis-lb',JSON.stringify(a.slice(-200)))}catch(e){}if(v>=70)setTimeout(()=>{beep(true);confetti()},150)}
